# ---------------------------------------------------------------------------
# _intermediate__models.yml: TESTS for the intermediate (linking) models.
#
# Two kinds of test live here:
#   data_tests   run against the real tables after they are built. Each is a
#                query that looks for bad rows; zero rows = pass.
#   unit_tests   run the model's SQL against a handful of made-up rows written
#                in this file, and compare the result with the rows we expect.
#                They prove the RULE (R1, R2, the allowlist) does what the
#                rulings say, before any real data is involved. The company
#                and party names in them are invented.
#
# More checks are single-file tests in pipeline/tests/:
#   assert_no_name_columns_past_staging.sql
#   assert_no_confirmed_link_before_company_filed.sql
#   assert_link_rows_are_consistent.sql
# ---------------------------------------------------------------------------

version: 2

models:

  - name: int_company_match_keys
    description: One row per company with its match key (name_key minus one trailing legal suffix), 5-digit ZIP code, status, filing date, and how many companies of any status share the match key.

    columns:

      - name: document_number
        data_tests:
          - not_null
          - unique
          # One row per company, like entity_lookup.

      - name: match_key
        data_tests:
          - not_null

      - name: match_key_company_count
        data_tests:
          - not_null

  - name: int_federal_lien_links
    description: One row per corporate federal-lien debtor per candidate company, with the link outcome. No names.

    columns: &link_columns
    # &link_columns names this block (a YAML "anchor"). The three models
    # below reuse it with *link_columns, so all four link models get exactly
    # the same tests without the list being typed four times.

      - name: source_record_id
        data_tests:
          - not_null

      - name: party_seq
        data_tests:
          - not_null

      - name: link_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CONFIRMED', 'AMBIGUOUS', 'NO_MATCH']
          # Three outcomes, never a yes/no (CLAUDE.md rule 3).

      - name: matched_on
        data_tests:
          - accepted_values:
              arguments:
                values: ['name_zip', 'unique_name']
          # NULL (not CONFIRMED) is allowed; any other text is a bug.

      - name: document_number
        data_tests:
          - not_null:
              config:
                where: "link_status <> 'NO_MATCH'"
          # `where` narrows the rows the test looks at. Every CONFIRMED or
          # AMBIGUOUS row must name a company.

          - relationships:
              arguments:
                to: ref('entity_lookup')
                field: document_number
              config:
                where: "link_status <> 'NO_MATCH'"
          # ... and that company must exist in entity_lookup.

  - name: int_dbpr_license_links
    description: One row per DBPR contractor license with a business name, or QB business record, per candidate company. No names.
    columns: *link_columns

  - name: int_dbpr_discipline_links
    description: One row per DBPR discipline complaint per candidate company, reached through the license, with that license's number for the citation (R27). Built, not displayed (R12). No names.
    columns: *link_columns

  - name: int_duval_party_links
    description: One row per TO-side business party on an allowlisted Duval lien, warrant or judgment per candidate company. Not for display (R20). No names.
    columns: *link_columns


  - name: int_federal_liens_status
    description: One row per federal tax lien, open or closed per ruling R6, with the date of any release or discharge and a mark on liens that ruling R7 says produce no flag. No names.

    columns:

      - name: filing_doc_number
        data_tests:
          - not_null
          - unique
          # One row per lien.

      - name: lien_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'closed']

      - name: is_unexplained
        data_tests:
          - not_null

      - name: filing_source_file
        data_tests:
          - not_null
          # Provenance: every lien row knows the state file it came from.

  - name: int_duval_document_status
    description: One row per allowlisted Duval lien, tax warrant or judgment that names a business on the TO side, open or closed per ruling R18. Not for display (R20). No names.

    columns:

      - name: instrument_number
        data_tests:
          - not_null
          - unique
          # One row per document.

      - name: document_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'closed']

      - name: flag_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['duval_lien', 'duval_tax_warrant', 'duval_judgment']

      - name: recorded_before_window
        data_tests:
          - not_null

      - name: source_file
        data_tests:
          - not_null


unit_tests:

  - name: match_key_strips_one_trailing_legal_suffix
    description: >
      The match key is the name_key minus ONE trailing legal suffix; the ZIP
      code is 5 digits or NULL; the count covers every status.
    model: int_company_match_keys
    given:
      - input: ref('entity_lookup')
        rows:
          - {document_number: C1, name_key: 'ACME L L C',    principal_zip: '32256-1234', status_code: A, file_date: 2020-01-01}
          - {document_number: C2, name_key: 'ACME INC',      principal_zip: '33101',      status_code: I, file_date: 2001-05-05}
          - {document_number: C3, name_key: 'ACME CO INC',   principal_zip: '32256',      status_code: A, file_date: 2010-01-01}
          - {document_number: C4, name_key: 'SMITH M D P A', principal_zip: ' ',          status_code: A, file_date: 2010-01-01}
          - {document_number: C5, name_key: 'INC',           principal_zip: 'K1A 0B1',    status_code: A, file_date: 2010-01-01}
          - {document_number: C6, name_key: 'LINCOLN GROUP', principal_zip: null,         status_code: A, file_date: 2010-01-01}
    expect:
      rows:
          - {document_number: C1, match_key: 'ACME',          zip5: '32256', match_key_company_count: 2}   # L L C stripped; the inactive ACME INC counts too
          - {document_number: C2, match_key: 'ACME',          zip5: '33101', match_key_company_count: 2}
          - {document_number: C3, match_key: 'ACME CO',       zip5: '32256', match_key_company_count: 1}   # only INC is stripped, CO stays
          - {document_number: C4, match_key: 'SMITH M D',     zip5: null,    match_key_company_count: 1}   # P A stripped; a blank ZIP is NULL
          - {document_number: C5, match_key: 'INC',           zip5: null,    match_key_company_count: 1}   # a name that IS a suffix is left alone; a foreign code is not a ZIP
          - {document_number: C6, match_key: 'LINCOLN GROUP', zip5: null,    match_key_company_count: 1}   # the INC inside LINCOLN is not a suffix

  - name: lien_links_follow_rulings_r1_and_r2
    description: >
      Nine debtors, one per branch of the linking rule: name and ZIP, ZIP
      differs, older than the company, two companies at one ZIP, unique name,
      no entity word, several companies, no company, unknown filing date.
    model: int_federal_lien_links
    given:
      - input: ref('stg_sunbiz__flr_filings')
        rows:
          - {filing_doc_number: L1, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L2, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L3, filing_date: 2015-01-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L4, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L5, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L6, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L7, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L8, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L9, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
      - input: ref('stg_sunbiz__flr_debtors')
        rows:
          - {filing_doc_number: L1, debtor_seq: 1, debtor_name: 'Acme, L.L.C.', zip5: '32256', published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L2, debtor_seq: 1, debtor_name: 'BOLT INC',     zip5: '32256', published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L3, debtor_seq: 1, debtor_name: 'CEDAR CORP',   zip5: '32256', published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L4, debtor_seq: 1, debtor_name: 'DELTA LLC',    zip5: '32256', published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L5, debtor_seq: 1, debtor_name: 'ECHO LLC',     zip5: null,    published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L6, debtor_seq: 1, debtor_name: 'FOXTROT',      zip5: null,    published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L7, debtor_seq: 1, debtor_name: 'GOLF LLC',     zip5: null,    published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L8, debtor_seq: 1, debtor_name: 'HOTEL LLC',    zip5: '32256', published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: L9, debtor_seq: 1, debtor_name: 'INDIA LLC',    zip5: '32256', published_on: 2026-10-03, loaded_at: 2026-11-12}
      - input: ref('int_company_match_keys')
        rows:
          - {document_number: C01, match_key: 'ACME',    zip5: '32256', file_date: 2020-01-01}   # same name and ZIP as L1
          - {document_number: C02, match_key: 'ACME',    zip5: '33101', file_date: 2001-01-01}   # a namesake at another ZIP
          - {document_number: C03, match_key: 'BOLT',    zip5: '33101', file_date: 2001-01-01}   # right name, wrong ZIP
          - {document_number: C04, match_key: 'CEDAR',   zip5: '32256', file_date: 2019-06-01}   # filed AFTER lien L3 (2015)
          - {document_number: C05, match_key: 'DELTA',   zip5: '32256', file_date: 2001-01-01}   # two companies,
          - {document_number: C06, match_key: 'DELTA',   zip5: '32256', file_date: 2002-01-01}   # same name, same ZIP
          - {document_number: C07, match_key: 'ECHO',    zip5: '32256', file_date: 2001-01-01}   # the only ECHO
          - {document_number: C08, match_key: 'FOXTROT', zip5: '32256', file_date: 2001-01-01}   # the only FOXTROT
          - {document_number: C09, match_key: 'GOLF',    zip5: '32256', file_date: 2001-01-01}   # two GOLFs,
          - {document_number: C10, match_key: 'GOLF',    zip5: '33101', file_date: 2001-01-01}   # and the debtor has no ZIP
          - {document_number: C11, match_key: 'INDIA',   zip5: '32256', file_date: null}         # no filing date on record
    expect:
      rows:
          - {source_record_id: L1, party_seq: 1, document_number: C01,  link_status: CONFIRMED, matched_on: name_zip,    link_reason: name_zip}
          - {source_record_id: L2, party_seq: 1, document_number: C03,  link_status: AMBIGUOUS, matched_on: null,        link_reason: zip_differs}
          - {source_record_id: L3, party_seq: 1, document_number: C04,  link_status: AMBIGUOUS, matched_on: null,        link_reason: before_company_filed}
          - {source_record_id: L4, party_seq: 1, document_number: C05,  link_status: AMBIGUOUS, matched_on: null,        link_reason: several_companies_same_zip}
          - {source_record_id: L4, party_seq: 1, document_number: C06,  link_status: AMBIGUOUS, matched_on: null,        link_reason: several_companies_same_zip}
          - {source_record_id: L5, party_seq: 1, document_number: C07,  link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name}
          - {source_record_id: L6, party_seq: 1, document_number: C08,  link_status: AMBIGUOUS, matched_on: null,        link_reason: no_entity_word}
          - {source_record_id: L7, party_seq: 1, document_number: C09,  link_status: AMBIGUOUS, matched_on: null,        link_reason: several_companies}
          - {source_record_id: L7, party_seq: 1, document_number: C10,  link_status: AMBIGUOUS, matched_on: null,        link_reason: several_companies}
          - {source_record_id: L8, party_seq: 1, document_number: null, link_status: NO_MATCH,  matched_on: null,        link_reason: no_company_with_this_match_key}
          - {source_record_id: L9, party_seq: 1, document_number: C11,  link_status: AMBIGUOUS, matched_on: null,        link_reason: date_unknown}

  - name: duval_links_keep_only_to_side_businesses_on_allowlisted_documents
    description: >
      What may enter the Duval link model: TO-side parties with a
      legal-entity word, on LN / WRT / JDG / CCCJUDG documents, and no
      judgment the State of Florida brought. Everything else stays out.
    model: int_duval_party_links
    given:
      - input: ref('duval_doc_type_allowlist')
        rows:
          - {doc_type_code: LN,      used_for: flag,   flag_type: duval_lien}
          - {doc_type_code: JDG,     used_for: flag,   flag_type: duval_judgment}
          - {doc_type_code: RELEASE, used_for: closes, flag_type: null}
      - input: ref('stg_duval__documents')
        rows:
          - {instrument_number: I1, doc_type_code: LN,      recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I2, doc_type_code: JDG,     recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I3, doc_type_code: JDG,     recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I4, doc_type_code: LN,      recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I5, doc_type_code: MTG,     recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I6, doc_type_code: RELEASE, recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I7, doc_type_code: LN,      recorded_date: 1775-01-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
      - input: ref('stg_duval__parties')
        rows:
          - {instrument_number: I1, party_role: FRM, party_seq: 1, party_name: 'CITY OF EXAMPLE',     file_date: 2025-02-02}   # FRM side: the lienholder, never linked
          - {instrument_number: I1, party_role: TO,  party_seq: 1, party_name: 'ALPHA ROOFING, LLC',  file_date: 2025-02-02}   # kept
          - {instrument_number: I2, party_role: FRM, party_seq: 1, party_name: 'FLORIDA STATE OF',    file_date: 2025-02-02}   # the State brought this judgment
          - {instrument_number: I2, party_role: TO,  party_seq: 1, party_name: 'BRAVO INC',           file_date: 2025-02-02}   # so its parties stay out
          - {instrument_number: I3, party_role: FRM, party_seq: 1, party_name: 'EXAMPLE CREDIT UNION', file_date: 2025-02-02}
          - {instrument_number: I3, party_role: TO,  party_seq: 1, party_name: 'BRAVO INC',           file_date: 2025-02-02}   # kept: a civil judgment
          - {instrument_number: I4, party_role: TO,  party_seq: 1, party_name: 'EXAMPLE PERSON',      file_date: 2025-02-02}   # no entity word: stays in staging
          - {instrument_number: I5, party_role: TO,  party_seq: 1, party_name: 'ALPHA ROOFING, LLC',  file_date: 2025-02-02}   # a mortgage: not on the allowlist
          - {instrument_number: I6, party_role: TO,  party_seq: 1, party_name: 'ALPHA ROOFING, LLC',  file_date: 2025-02-02}   # a release: allowlisted to CLOSE, not to flag
          - {instrument_number: I7, party_role: TO,  party_seq: 1, party_name: 'CHARLIE CORP',        file_date: 2025-02-02}   # kept, but its 1775 date is a placeholder
      - input: ref('int_company_match_keys')
        rows:
          - {document_number: C01, match_key: 'ALPHA ROOFING', zip5: '32256', file_date: 2020-01-01}
          - {document_number: C02, match_key: 'BRAVO',         zip5: '32256', file_date: 2020-01-01}
          - {document_number: C03, match_key: 'CHARLIE',       zip5: '32256', file_date: 2020-01-01}
    expect:
      rows:
          - {source_record_id: I1, party_seq: 1, document_number: C01, link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name,  source_date: 2025-02-01}
          - {source_record_id: I3, party_seq: 1, document_number: C02, link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name,  source_date: 2025-02-01}
          - {source_record_id: I7, party_seq: 1, document_number: C03, link_status: AMBIGUOUS, matched_on: null,        link_reason: date_unknown, source_date: null}

  - name: lien_status_follows_rulings_r5_r6_and_r7
    description: >
      Ten liens, one per case: nothing filed since; released by a later
      daily; discharged only; a release older than the snapshot that lists
      it; filed and released in dailies; a cancellation date; a status-C
      party row; a filing status that is not active; a later release whose
      date could not be read; an earlier release whose date could not be
      read. The last two prove the status is decided on the release EVENT
      existing, not on its date.
    model: int_federal_liens_status
    given:
      - input: ref('stg_sunbiz__flr_filings')
        rows:
          - {filing_doc_number: L1, filing_date: 2020-01-01, filing_status: A, cancellation_date: null,       source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L2, filing_date: 2020-01-01, filing_status: A, cancellation_date: null,       source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L3, filing_date: 2020-01-01, filing_status: A, cancellation_date: null,       source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L4, filing_date: 2020-01-01, filing_status: A, cancellation_date: null,       source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L5, filing_date: 2026-10-19, filing_status: A, cancellation_date: null,       source_kind: daily,     published_on: 2026-10-19, source_file: 20261019flrf.txt.gz, loaded_at: 2026-11-18}
          - {filing_doc_number: L6, filing_date: 2020-01-01, filing_status: A, cancellation_date: 2021-01-01, source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L7, filing_date: 2020-01-01, filing_status: A, cancellation_date: null,       source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L8, filing_date: 2020-01-01, filing_status: L, cancellation_date: null,       source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L9, filing_date: 2020-01-01, filing_status: A, cancellation_date: null,       source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
          - {filing_doc_number: L10, filing_date: 2020-01-01, filing_status: A, cancellation_date: null,      source_kind: quarterly, published_on: 2026-10-03, source_file: FLRF.TXT.gz,         loaded_at: 2026-11-12}
      - input: ref('stg_sunbiz__flr_events')
        rows:
          - {filing_doc_number: L2, event_doc_number: E2, action_code: COR, event_filing_date: 2026-10-30, published_on: 2026-10-30, source_file: 20261030flre.txt.gz, loaded_at: 2026-11-18}   # released after the snapshot
          - {filing_doc_number: L3, event_doc_number: E3, action_code: COD, event_filing_date: 2022-09-21, published_on: 2026-10-03, source_file: FLRE.TXT.gz,         loaded_at: 2026-11-12}   # a discharge: stated, never closes
          - {filing_doc_number: L4, event_doc_number: E4, action_code: COR, event_filing_date: 2023-03-28, published_on: 2026-10-03, source_file: FLRE.TXT.gz,         loaded_at: 2026-11-12}   # a release OLDER than the snapshot that still lists the lien
          - {filing_doc_number: L5, event_doc_number: E5, action_code: COR, event_filing_date: 2026-11-04, published_on: 2026-11-04, source_file: 20261104flre.txt.gz, loaded_at: 2026-11-12}   # filed 10-19, released 11-04
          - {filing_doc_number: L1, event_doc_number: E1, action_code: AGI, event_filing_date: 2026-11-16, published_on: 2026-11-16, source_file: 20261116flre.txt.gz, loaded_at: 2026-11-18}   # an amendment changes nothing
          - {filing_doc_number: L9, event_doc_number: E9, action_code: COR, event_filing_date: null,       published_on: 2026-11-09, source_file: 20261109flre.txt.gz, loaded_at: 2026-11-18}   # released after the snapshot, but the date text did not parse
          - {filing_doc_number: L10, event_doc_number: E10, action_code: COR, event_filing_date: null,     published_on: 2026-10-03, source_file: FLRE.TXT.gz,         loaded_at: 2026-11-12}   # a release in the snapshot itself, date unreadable
      - input: ref('stg_sunbiz__flr_debtors')
        rows:
          - {filing_doc_number: L7, filing_status: C}   # the undocumented status letter
          - {filing_doc_number: L1, filing_status: T}   # party-row status other than C is ignored (ruling R5)
      - input: ref('stg_sunbiz__flr_secured')
        rows:
          - {filing_doc_number: L1, filing_status: A}
    expect:
      rows:
          - {filing_doc_number: L1, lien_status: open,   closed_reason: null,                     released_on: null,       discharge_recorded_on: null,       is_unexplained: false, unexplained_reason: null,                                               release_source_file: null}
          - {filing_doc_number: L2, lien_status: closed, closed_reason: certificate_of_release,   released_on: 2026-10-30, discharge_recorded_on: null,       is_unexplained: false, unexplained_reason: null,                                               release_source_file: 20261030flre.txt.gz}
