  - name: lien_links_namesake_key_edge_cases
    description: >
      Ruling R30, the edges of the namesake key. Every debtor here has no ZIP
      code and exactly one company on its match key, so each case turns only
      on whether the second company counts as a near-namesake.
      E1 and E2 are names made only of THE and legal-form words. The match
      key has already cut one suffix off them, and whichever of THE and the
      suffixes is removed first, one of these two pairs used to slip through.
      Both must be AMBIGUOUS.
      E3 and E4 are near-namesakes that one small part of the key catches:
      the "one or more" on the suffix step, and the trim after AND is
      removed. Both must be AMBIGUOUS.
      E5 to E8 are controls that must stay CONFIRMED, one for each guard in
      the key: AND inside a longer word, THE in the middle of a name, a
      word that only starts with THE, and a legal suffix in the middle of a
      name. Each case fails if its one part of the key is taken away.
    model: int_federal_lien_links
    given:
      - input: ref('stg_sunbiz__flr_filings')
        rows:
          - {filing_doc_number: E1, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: E2, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: E3, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: E4, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: E5, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: E6, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: E7, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
          - {filing_doc_number: E8, filing_date: 2024-03-01, published_on: 2026-10-03, loaded_at: 2026-11-12}
      - input: ref('stg_sunbiz__flr_debtors')
        rows:
          - {filing_doc_number: E1, debtor_seq: 1, debtor_name: 'THE LIMITED INC',  zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # the other company is THE LIMITED: one suffix fewer
          - {filing_doc_number: E2, debtor_seq: 1, debtor_name: 'CORPORATION LLC',  zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # the other company is THE CORPORATION INC: a leading THE more
          - {filing_doc_number: E3, debtor_seq: 1, debtor_name: 'GOLF LLC',              zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # the other company is GOLF CO LTD INC: its match key still ends in TWO suffixes
          - {filing_doc_number: E4, debtor_seq: 1, debtor_name: 'INDIA LLC',             zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # the other company is AND THE INDIA INC: the THE leads only once the AND is gone
          - {filing_doc_number: E5, debtor_seq: 1, debtor_name: 'SANDY ROOFING LLC',     zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # control: the AND inside SANDY is not the word AND
          - {filing_doc_number: E6, debtor_seq: 1, debtor_name: 'OVER THE TOP LLC',      zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # control: a THE in the middle of a name stays
          - {filing_doc_number: E7, debtor_seq: 1, debtor_name: 'THEODORE LLC',          zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # control: THEODORE only starts with the letters THE
          - {filing_doc_number: E8, debtor_seq: 1, debtor_name: 'HOTEL CO SERVICES LLC', zip5: null, published_on: 2026-10-03, loaded_at: 2026-11-12}   # control: a CO in the middle of a name stays
      - input: ref('int_company_match_keys')
        rows:
          - {document_number: C81, match_key: 'THE LIMITED',     zip5: '32256', file_date: 2001-01-01}   # THE LIMITED INC: E1's company
          - {document_number: C82, match_key: 'THE',             zip5: '33101', file_date: 2001-01-01}   # THE LIMITED: the match key cut LIMITED off and left only THE
          - {document_number: C83, match_key: 'CORPORATION',     zip5: '32256', file_date: 2001-01-01}   # CORPORATION LLC: E2's company
          - {document_number: C84, match_key: 'THE CORPORATION', zip5: '33101', file_date: 2001-01-01}   # THE CORPORATION INC
          - {document_number: C85, match_key: 'GOLF',              zip5: '32256', file_date: 2001-01-01}   # E3's company
          - {document_number: C86, match_key: 'GOLF CO LTD',       zip5: '33101', file_date: 2001-01-01}   # GOLF CO LTD INC: the match key dropped INC, and CO and LTD are both still there
          - {document_number: C87, match_key: 'INDIA',             zip5: '32256', file_date: 2001-01-01}   # E4's company
          - {document_number: C88, match_key: 'AND THE INDIA',     zip5: '33101', file_date: 2001-01-01}
          - {document_number: C89, match_key: 'SANDY ROOFING',     zip5: '32256', file_date: 2001-01-01}   # E5's company
          - {document_number: C90, match_key: 'S Y ROOFING',       zip5: '33101', file_date: 2001-01-01}   # what SANDY ROOFING would turn into if the AND inside it were cut out
          - {document_number: C91, match_key: 'OVER THE TOP',      zip5: '32256', file_date: 2001-01-01}   # E6's company
          - {document_number: C92, match_key: 'OVER TOP',          zip5: '33101', file_date: 2001-01-01}
          - {document_number: C93, match_key: 'THEODORE',          zip5: '32256', file_date: 2001-01-01}   # E7's company
          - {document_number: C94, match_key: 'ODORE',             zip5: '33101', file_date: 2001-01-01}   # what THEODORE would turn into if its first three letters were cut off
          - {document_number: C95, match_key: 'HOTEL CO SERVICES', zip5: '32256', file_date: 2001-01-01}   # E8's company
          - {document_number: C96, match_key: 'HOTEL SERVICES',    zip5: '33101', file_date: 2001-01-01}
    expect:
      rows:
          - {source_record_id: E1, party_seq: 1, document_number: C81, link_status: AMBIGUOUS, matched_on: null,        link_reason: several_similar_names}
          - {source_record_id: E2, party_seq: 1, document_number: C83, link_status: AMBIGUOUS, matched_on: null,        link_reason: several_similar_names}
          - {source_record_id: E3, party_seq: 1, document_number: C85, link_status: AMBIGUOUS, matched_on: null,        link_reason: several_similar_names}
          - {source_record_id: E4, party_seq: 1, document_number: C87, link_status: AMBIGUOUS, matched_on: null,        link_reason: several_similar_names}
          - {source_record_id: E5, party_seq: 1, document_number: C89, link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name}
          - {source_record_id: E6, party_seq: 1, document_number: C91, link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name}
          - {source_record_id: E7, party_seq: 1, document_number: C93, link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name}
          - {source_record_id: E8, party_seq: 1, document_number: C95, link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name}

  - name: dbpr_license_links_follow_ruling_r30
    description: >
      Ruling R30 on the DBPR license model. A contractor license with a ZIP
      code has a near-namesake at the same ZIP code, and a QB business
      record with no ZIP code has one elsewhere in Florida. Neither may be
      CONFIRMED. A third license has no near-namesake and still is. The
      names and the license numbers are invented.
    model: int_dbpr_license_links
    given:
      - input: ref('stg_dbpr__licenses')
        rows:
          - {record_kind: contractor_license, alternate_license_number: TEST011, dba_name: 'QUEBEC BUILDERS LLC', licensee_name: null,                    zip5: '32256', effective_date: 2024-03-01}   # THE QUEBEC BUILDERS is at the same ZIP code
          - {record_kind: business,           alternate_license_number: null,    dba_name: null,                  licensee_name: 'ROMEO AND SIERRA INC',  zip5: null,    effective_date: 2024-03-01}   # ROMEO & SIERRA is somewhere else
          - {record_kind: contractor_license, alternate_license_number: TEST013, dba_name: 'PAPA PLUMBING LLC',   licensee_name: null,                    zip5: '32256', effective_date: 2024-03-01}   # control: no near-namesake
      - input: ref('int_company_match_keys')
        rows:
          - {document_number: C61, match_key: 'QUEBEC BUILDERS',     zip5: '32256', file_date: 2001-01-01}
          - {document_number: C62, match_key: 'THE QUEBEC BUILDERS', zip5: '32256', file_date: 2001-01-01}
          - {document_number: C63, match_key: 'ROMEO AND SIERRA',    zip5: '32256', file_date: 2001-01-01}
          - {document_number: C64, match_key: 'ROMEO SIERRA',        zip5: '33101', file_date: 2001-01-01}
          - {document_number: C65, match_key: 'PAPA PLUMBING',       zip5: '32256', file_date: 2001-01-01}
    expect:
      rows:
          - {party_seq: 1, document_number: C61, link_status: AMBIGUOUS, matched_on: null,     link_reason: several_similar_names_same_zip}
          - {party_seq: 1, document_number: C63, link_status: AMBIGUOUS, matched_on: null,     link_reason: several_similar_names}
          - {party_seq: 1, document_number: C65, link_status: CONFIRMED, matched_on: name_zip, link_reason: name_zip}

  - name: duval_links_follow_ruling_r30
    description: >
      Ruling R30 on the Duval model, where no record has a ZIP code and so a
      near-namesake counts anywhere in Florida. Two TO-side parties each
      have a company on their match key and a second company whose name
      differs only by a leading THE or by an extra legal suffix. Neither
      may be CONFIRMED. A third party has no near-namesake and still is.
    model: int_duval_party_links
    given:
      - input: ref('duval_doc_type_allowlist')
        rows:
          - {doc_type_code: LN, used_for: flag, flag_type: duval_lien}
      - input: ref('stg_duval__documents')
        rows:
          - {instrument_number: I11, doc_type_code: LN, recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I12, doc_type_code: LN, recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
          - {instrument_number: I13, doc_type_code: LN, recorded_date: 2025-02-01, file_date: 2025-02-02, loaded_at: 2026-11-12}
      - input: ref('stg_duval__parties')
        rows:
          - {instrument_number: I11, party_role: TO, party_seq: 1, party_name: 'LIMA ROOFING LLC',   file_date: 2025-02-02}   # THE LIMA ROOFING also exists
          - {instrument_number: I12, party_role: TO, party_seq: 1, party_name: 'MIKE ELECTRIC INC',  file_date: 2025-02-02}   # MIKE ELECTRIC CO INC also exists
          - {instrument_number: I13, party_role: TO, party_seq: 1, party_name: 'OSCAR PAVING CORP',  file_date: 2025-02-02}   # control: the only one
      - input: ref('int_company_match_keys')
        rows:
          - {document_number: C71, match_key: 'LIMA ROOFING',     zip5: '32256', file_date: 2020-01-01}
          - {document_number: C72, match_key: 'THE LIMA ROOFING', zip5: '33101', file_date: 2020-01-01}
          - {document_number: C73, match_key: 'MIKE ELECTRIC',    zip5: '32256', file_date: 2020-01-01}
          - {document_number: C74, match_key: 'MIKE ELECTRIC CO', zip5: '32256', file_date: 2020-01-01}
          - {document_number: C75, match_key: 'OSCAR PAVING',     zip5: '32256', file_date: 2020-01-01}
    expect:
      rows:
          - {source_record_id: I11, party_seq: 1, document_number: C71, link_status: AMBIGUOUS, matched_on: null,        link_reason: several_similar_names}
          - {source_record_id: I12, party_seq: 1, document_number: C73, link_status: AMBIGUOUS, matched_on: null,        link_reason: several_similar_names}
          - {source_record_id: I13, party_seq: 1, document_number: C75, link_status: CONFIRMED, matched_on: unique_name, link_reason: unique_name}

  - name: duval_links_keep_only_to_side_businesses_on_allowlisted_documents
    description: >
