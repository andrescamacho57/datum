          - {filing_doc_number: L5, event_doc_number: E5, action_code: COR, event_filing_date: 2026-11-04, published_on: 2026-11-04, source_file: 20261104flre.txt.gz, loaded_at: 2026-11-12}   # filed 10-19, released 11-04
          - {filing_doc_number: L1, event_doc_number: E1, action_code: AGI, event_filing_date: 2026-11-16, published_on: 2026-11-16, source_file: 20261116flre.txt.gz, loaded_at: 2026-11-18}   # an amendment changes nothing
