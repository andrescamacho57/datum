  - name: lien_status_follows_rulings_r5_r6_and_r7
    description: >
      Eleven liens, one per case: nothing filed since; released by a later
      daily; discharged only; a release older than the snapshot that lists
      it; filed and released in dailies; a cancellation date; a status-C
      party row; a filing status that is not active; a later release whose
      date could not be read; an earlier release whose date could not be
      read; two later releases with unreadable dates in two different
      files. The ninth and tenth prove the status is decided on the release
      EVENT existing, not on its date. The eleventh proves the release's
      source file is the same one on every run: the earliest published.
    model: int_federal_liens_status
    given:
      - input: ref('stg_sunbiz__flr_filings')
