  - name: duval_status_follows_ruling_r18
    description: >
      Six documents: no link; released by instrument number; satisfied by a
      link that gives only book and page as text; a partial release only; a
      release of some OTHER document that must not close anything here; and
      one closed by TWO documents recorded on the same day, where "closed
      by" must name one of them whole (the lower instrument number), never
      the number of one with the type or file of the other. The lower
      number, R6, is given the type code that sorts LAST (SAT after
      RELEASE), so the test fails if the instrument number ever stops
      deciding the tie.
    model: int_duval_document_status
    given:
      - input: ref('duval_doc_type_allowlist')
        rows:
          - {doc_type_code: LN,      used_for: flag,            flag_type: duval_lien}
          - {doc_type_code: JDG,     used_for: flag,            flag_type: duval_judgment}
          - {doc_type_code: RELEASE, used_for: closes,          flag_type: null}
          - {doc_type_code: SAT,     used_for: closes,          flag_type: null}
          - {doc_type_code: PTL REL, used_for: partial_release, flag_type: null}
      - input: ref('int_duval_party_links')
        rows:
          - {source_record_id: D1}
          - {source_record_id: D2}
          - {source_record_id: D3}
          - {source_record_id: D4}
          - {source_record_id: D5}
          - {source_record_id: D6}
