# ---------------------------------------------------------------------------
# _seeds.yml: descriptions and TESTS for the reference seeds.
#
# A seed is a small CSV file in pipeline/seeds/ that `dbt seed` (or `dbt
# build`) loads as a table. These are lookup tables the linking and citation
# rules depend on. They are seeds, not SQL, so a change to them is a one-line diff
# anyone can review.
# ---------------------------------------------------------------------------

version: 2

seeds:

  - name: dbpr_license_type_map
    description: >
      Ruling R14. DBPR's discipline files name a license kind in words
      ("Certified General Contractor"); its license file uses a code (CGC).
      One row per kind seen in the discipline files, with its code. Drafted
      2026-11-18 from the 19 distinct values in the five discipline files.
    columns:
      - name: license_type
        data_tests:
          - not_null
          - unique
          # One code per kind: a kind listed twice would double every
          # complaint against it.
      - name: occupation_code
        data_tests:
          - not_null
          - unique

  - name: duval_doc_type_allowlist
    description: >
      Ruling R16. The ONLY Duval document type codes allowed past staging,
      and what each is used for: "flag" (can become a flag on a company),
      "closes" (a release or satisfaction that closes a lien or judgment),
      "partial_release" (shown as an event; does not close). Any code not
      listed here stays in staging, including every criminal, family and
      personal record type.
    columns:
      - name: doc_type_code
        data_tests:
          - not_null
          - unique
      - name: used_for
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['flag', 'closes', 'partial_release']
      - name: flag_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['duval_lien', 'duval_tax_warrant', 'duval_judgment']
          # Empty on "closes" and "partial_release" rows.

  - name: search_page_sources
    description: >
      Rulings R9, R21 and R27. CLAUDE.md rule 3 wants a source URL that points
      at the specific record. No source we use offers one, so each of these
      rulings allows ONE search page for one source, with the number a reader
      types into it. One row per approved exception. The test
      assert_shown_flags_cite_an_approved_search_page fails when a flag that
      may be shown cites anything else. A new row here needs a ruling.
      The row sunbiz_cor (added in leg C1) is the company's own record: ruling
      R9 applied to a company, which is the working rule of open question Q9.
      The test assert_company_search_cites_the_approved_search_page checks it.
    columns:
      - name: source
        data_tests:
          - not_null
          - unique
          # One approved address per source.
          - accepted_values:
              arguments:
                values: ['sunbiz_flr', 'dbpr', 'duval', 'sunbiz_cor']
      - name: ruling
        data_tests:
          - not_null
          # No exception without a ruling behind it.
      - name: search_page_url
        data_tests:
          - not_null
      - name: looked_up_by
        data_tests:
          - not_null

  - name: possible_match_reasons
    description: >
      Phase C working rule W3. A possible match is a record on an AMBIGUOUS
      link that would be a shown flag if the link were CONFIRMED. Decision d19
      says such a record shows as "possible match: verify", and nobody has yet
      decided WHICH reasons for being AMBIGUOUS are safe to show: a record
      that predates the company could accuse the wrong company, and a name
      with no legal-entity word may be a person's. So this seed lists every
      reason code with is_shown false, and Andres turns a reason on with a
      ruling. The test assert_possible_matches_stay_hidden compares the mart
      to the literal false, so showing a reason takes two reviewed edits:
      this file and that test (the reasoning of ruling R28).
    columns:
      - name: link_reason
        data_tests:
          - not_null
          - unique
          # One decision per reason: a reason listed twice would double every
          # possible match that carries it.
          - accepted_values:
              arguments:
                values: ['before_company_filed', 'date_unknown', 'no_entity_word', 'several_companies', 'several_companies_same_zip', 'several_similar_names', 'several_similar_names_same_zip', 'zip_differs', 'zip_unreadable']
          # The nine reasons the linking macro can give an AMBIGUOUS link
          # (macros/company_matching.sql). A tenth must be added here on purpose.
      - name: is_shown
        data_tests:
          - not_null
          # TRUE or FALSE, never unknown.
      - name: meaning
        data_tests:
          - not_null
