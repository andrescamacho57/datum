# dbt project config: tells dbt what this project is called and how to build each folder of models.
name: datum                             # project name; must match the key under `models:` below
version: "0.1.0"                        # our own version label for the project
config-version: 2                       # dbt's config file format version (2 is current)
profile: datum                          # which entry in ~/.dbt/profiles.yml holds the Snowflake connection
model-paths: ["models"]                 # folder where dbt looks for .sql models
seed-paths: ["seeds"]                   # folder where dbt looks for .csv files to load as tables

models:
  datum:                                # settings for models in this project
    staging:                            # applies to everything in models/staging/
      +schema: staging                  # builds into schema DEV_STAGING (target schema + "_" + this)
      +materialized: view               # a saved query: no storage cost, always reflects raw
    intermediate:                       # applies to everything in models/intermediate/
      +schema: intermediate             # builds into schema DEV_INTERMEDIATE: where sources meet (a lien's debtor matched to a company)
      +materialized: table              # stored results: the link models join 13M companies, so compute once, not on every query
    marts:                              # applies to everything in models/marts/
      +schema: marts                    # builds into schema DEV_MARTS
      +materialized: table              # stored results: fast to query

seeds:
  datum:                                # settings for seeds (CSV files) in this project
    +schema: evals                      # loads into schema DEV_EVALS, apart from pipeline data
    test_set:                           # settings for seeds/test_set.csv only
      +column_types:                    # don't let dbt guess these column types
        expected_document_number: varchar  # IDs are text (P24771), never numbers
        verified_on: date               # the day the expected answer was checked
    extracted_inputs:                   # settings for seeds/extracted_inputs.csv (written by src/datum/extract.py)
      +column_types:
        case_id: integer                # join key to test_set
        is_specific: boolean            # Python writes True/False; load it as a real TRUE/FALSE
    dbpr_license_type_map:              # settings for seeds/dbpr_license_type_map.csv (ruling R14)
      +schema: reference                # loads into schema DEV_REFERENCE: small lookup tables the pipeline depends on, apart from eval data
      +column_types:
        license_type: varchar           # the license kind in words, as the discipline files write it
        occupation_code: varchar        # the same kind as the license file's code
    duval_doc_type_allowlist:           # settings for seeds/duval_doc_type_allowlist.csv (ruling R16)
      +schema: reference                # DEV_REFERENCE
      +column_types:
        doc_type_code: varchar          # the Clerk's document type code, e.g. LN
        used_for: varchar               # flag, closes or partial_release
        flag_type: varchar              # the flag a "flag" code produces; empty for the others
