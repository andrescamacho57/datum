# gitleaks.toml: the rules the secret scan in .github/workflows/ci.yml runs with.
#
# It asks for gitleaks' own built-in rules and adds nothing and removes nothing.
#
# Why the file exists at all: without an explicit rules file, gitleaks reads one named .gitleaks.toml
# from the folder it scans. The folder it scans is the commit under test, so a pull request could add
# a rules file that allows everything and the scan would pass. Pointing the scan at this file closes
# that door. This file is under .github/, which REVIEW.md puts in the High tier, so a change to it
# gets the deepest review.
#
# If the scan ever reports something that is not a secret, add the exception here, with a comment
# saying why, and never as a "gitleaks:allow" comment on the line: the scan ignores those on purpose.

[extend]
useDefault = true
